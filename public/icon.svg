<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card with rounded corners -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Subtle Radial Radar Rings -->
  <circle cx="256" cy="200" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="3" />
  <circle cx="256" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Map Location Pin Icon -->
  <g filter="url(#glow)">
    <path 
      d="M256 90 C210 90 174 126 174 172 C174 232 256 310 256 310 C256 310 338 232 338 172 C338 126 302 90 256 90 Z" 
      fill="url(#pinGrad)" 
    />
    <circle cx="256" cy="170" r="32" fill="#0f172a" />
    <circle cx="256" cy="170" r="18" fill="#38bdf8" />
  </g>

  <!-- "PLANALTINA" Typography -->
  <g filter="url(#glow)">
    <text 
      x="256" 
      y="405" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
      font-size="52" 
      font-weight="900" 
      letter-spacing="5" 
      fill="url(#textGrad)" 
      text-anchor="middle"
      style="user-select: none;"
    >PLANALTINA</text>
  </g>

  <!-- Bottom Subtitle Badge -->
  <rect x="186" y="430" width="140" height="26" rx="13" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text 
    x="256" 
    y="448" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="14" 
    font-weight="800" 
    letter-spacing="4" 
    fill="#93c5fd" 
    text-anchor="middle"
    style="user-select: none;"
  >GOIÁS</text>
</svg>
